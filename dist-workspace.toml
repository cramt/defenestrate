[workspace]
members = ["cargo:."]

# The release binary and its `curl | sh` installer, built by
# .github/workflows/release.yml on a version tag. Edit this, then
# `dist generate` rewrites the workflow: CI's plan job fails if the two
# disagree.
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell"]
# musl, statically linked: one binary for every x86_64 distro whatever its
# glibc, and dfnstrate is Linux-only (efibootmgr, ntfs-3g, /dev/kvm).
targets = ["x86_64-unknown-linux-musl"]
# Where most distros already put ~/.local/bin on PATH; CARGO_HOME (dist's
# default) assumes a Rust toolchain the users of this don't need.
install-path = ["$XDG_BIN_HOME/", "~/.local/bin"]
# `dfnstrate self-update` is built in (the self-update feature), so no
# separate dfnstrate-update binary.
install-updater = false
# builtin-shell makes the build fail without DEFENESTRATE_SHELL_DIR, which
# .github/build-setup.yml sets after building and signing the shell.
features = ["builtin-shell", "self-update"]
github-build-setup = "../build-setup.yml"
# PRs build the binary and installer as workflow artifacts, without a
# release: the way to test a release build before tagging one.
pr-run-mode = "upload"
# Released binaries come from a clean build, not a target dir restored from
# a cache that PR runs can write to. (pr-run-mode = "upload" would turn
# swatinem/rust-cache on otherwise.)
cache-builds = false

# Commit-pinned, the versions dist 0.34.0 asks for. Bump with dist.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
