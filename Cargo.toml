# Only the Linux-side tool. The shell cross-compiles to Windows with its own
# toolchain file, and prototypes are standalone, so both stay out.
[workspace]
members = ["cli"]
exclude = ["shell", "prototypes"]
resolver = "3"

[profile.release]
lto = "thin"

# What dist builds the release binaries with (dist-workspace.toml). Not
# stripped: that saves ~0.5 MB of the 5.8 MB download, and the symbols are
# what make a panic's backtrace say where.
[profile.dist]
inherits = "release"
