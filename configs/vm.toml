# Throwaway QEMU guest: wipes its disk without asking and logs straight in.
disk = { wipe = { diskId = 0 } }
# `dfnstrate vm` boots the disk first, so skipping the prompt can't loop setup.
bootPrompt = false
# Exercises the baked-app path on every image build.
apps = ["Mozilla.Firefox"]
appsLock = "../apps.lock.json"

[user]
name = "user"
autoLogon = true
