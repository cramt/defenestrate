# The distro itself: everything here is something stock Windows does that we
# don't. dfnstrate layers every config over this file (it's compiled in), the
# Nix module included. Machine-specific settings (user, disk) belong in a
# per-machine config.
#
# Tables merge, lists append, other values are replaced by later files.

# Our shell (shell/), compiled into dfnstrate. Explorer is still around as a
# program (`explorer .` opens a file window); it's just not the shell anymore.
shell = "builtin"

# The Mono variant: conhost only offers fixed-pitch fonts, and the plain Nerd
# Font has double-width icons that aren't. The shell draws with this family
# too (FONT_FACE in shell/src/main.rs). Same tarball nixpkgs' nerd-fonts.iosevka
# unpacks.
fonts = [
  { url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.0/Iosevka.tar.xz", hash = "sha256-tD/NExZzhSv5+8ykpVNFXI0UwWHtpPx4tS+vs+1zz0o=", member = "IosevkaNerdFontMono-Regular.ttf" },
  { url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.0/Iosevka.tar.xz", hash = "sha256-tD/NExZzhSv5+8ykpVNFXI0UwWHtpPx4tS+vs+1zz0o=", member = "IosevkaNerdFontMono-Bold.ttf" },
  { url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.0/Iosevka.tar.xz", hash = "sha256-tD/NExZzhSv5+8ykpVNFXI0UwWHtpPx4tS+vs+1zz0o=", member = "IosevkaNerdFontMono-Italic.ttf" },
  { url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.0/Iosevka.tar.xz", hash = "sha256-tD/NExZzhSv5+8ykpVNFXI0UwWHtpPx4tS+vs+1zz0o=", member = "IosevkaNerdFontMono-BoldItalic.ttf" },
]

# Microsoft only hands out download links that expire after a day, so this
# pins the file and `dfnstrate fetch` gets a fresh link. When Microsoft moves
# on to a newer build, `dfnstrate fetch --update` prints the new pin.
[iso]
name = "Windows11_Client_x64_en-us_26300_9457.iso"
hash = "sha256-vUMH3zK8ivM7OczssRdK6zRThmMPiaK4bHpONrVeplA="
language = "English (United States)"

# WSL, installed offline during setup. A machine's Linux install, if it has
# one, goes in wsl.linux (see README).
[wsl]
package = { url = "https://github.com/microsoft/WSL/releases/download/3.0.3/wsl.3.0.3.0.x64.msi", hash = "sha256-rpdyhpdCVb0mv5JfAPQPVpLGsghBVcvAVjwJrqCR8hE=" }
busybox = { url = "https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox", hash = "sha256-bhI+fzICqMHpsflNiUFYCiUTU4K5no0+NPuFi7oxE0g=" }

# Ads, upsells and cloud-account funnels. Xbox stays (games want its
# identity provider), as do the codecs and the small utilities.
# There's no Copilot to remove: this build doesn't provision one.
[appx]
remove = [
  "Clipchamp.Clipchamp",
  "MSTeams",
  "Microsoft.BingNews",
  "Microsoft.BingSearch",
  "Microsoft.BingWeather",
  "Microsoft.GetHelp",
  "Microsoft.MicrosoftOfficeHub",
  "Microsoft.MicrosoftSolitaireCollection",
  "Microsoft.OutlookForWindows",
  "Microsoft.PowerAutomateDesktop",
  "Microsoft.Todos",
  "Microsoft.Windows.DevHome",
  "Microsoft.WindowsFeedbackHub",
  "Microsoft.YourPhone",
  "MicrosoftCorporationII.QuickAssist",
  # Widgets. They hang off explorer's taskbar, which we don't run.
  "MicrosoftWindows.Client.WebExperience",
  "MicrosoftWindows.CrossDevice",
]

[registry.system]
# 24H2+ silently BitLockers the system drive on first sign-in and escrows
# the recovery key to a Microsoft account. We don't have one.
'CurrentControlSet\Control\BitLocker'.PreventDeviceEncryption.dword = 1
# Keep the RTC in UTC like every other OS, so dual-booting Linux doesn't
# shift the clock by the UTC offset every boot.
'CurrentControlSet\Control\TimeZoneInformation'.RealTimeIsUniversal.dword = 1
# Fast Startup is hibernation in disguise: it leaves NTFS marked in use,
# and Linux then refuses to mount it read-write.
'CurrentControlSet\Control\Session Manager\Power'.HiberbootEnabled.dword = 0

[registry.software]
# Conhost's font picker only lists TrueType faces named here.
'Microsoft\Windows NT\CurrentVersion\Console\TrueTypeFont'."000".sz = "Iosevka NFM"
# Pro clamps 0 ("Security") up to 1 ("Required"); only Enterprise/Education
# honour 0. Still the lowest this edition goes.
'Policies\Microsoft\Windows\DataCollection'.AllowTelemetry.dword = 0
'Policies\Microsoft\Windows\CloudContent'.DisableWindowsConsumerFeatures.dword = 1
# Recall.
'Policies\Microsoft\Windows\WindowsAI'.DisableAIDataAnalysis.dword = 1
'Policies\Microsoft\Windows\WindowsUpdate\AU'.NoAutoRebootWithLoggedOnUsers.dword = 1

[registry.defaultUser]
# The Default profile ships with this Run entry, so every new account
# installs OneDrive on first sign-in.
'Software\Microsoft\Windows\CurrentVersion\Run'.OneDriveSetup = "delete"
# Silently installed "suggested" apps and the ads in Start / lock screen.
'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager' = { OemPreInstalledAppsEnabled.dword = 0, PreInstalledAppsEnabled.dword = 0, SilentInstalledAppsEnabled.dword = 0, SoftLandingEnabled.dword = 0, SystemPaneSuggestionsEnabled.dword = 0, RotatingLockScreenOverlayEnabled.dword = 0 }
# Win+L locks the session before the shell's keyboard hook can swallow it,
# and the shell uses Super+L for COSMIC's "focus right". Super+Escape locks
# instead (shell/src/keys.rs).
'Software\Microsoft\Windows\CurrentVersion\Policies\System'.DisableLockWorkstation.dword = 1
# Bing results in local search.
'Software\Policies\Microsoft\Windows\Explorer'.DisableSearchBoxSuggestions.dword = 1
'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'.HideFileExt.dword = 0
# Every console window's defaults. FontFamily 0x36 is TMPF_TRUETYPE |
# FF_MODERN; FontSize is the cell height (18) in the high word.
Console = { FaceName.sz = "Iosevka NFM", FontFamily.dword = 54, FontWeight.dword = 400, FontSize.dword = 1179648 }
# Windows 11 hands every new console to Windows Terminal once its package is
# registered for the user ("Let Windows decide"), and Terminal ignores all of
# the above (it came up in Cascadia Mono). This GUID is conhost, the
# "Windows Console Host" choice in that setting.
'Console\%%Startup' = { DelegationConsole.sz = "{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}", DelegationTerminal.sz = "{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}" }
# powershell.exe's own subkeys pin Lucida Console over the defaults above.
'Console\%SystemRoot%_System32_WindowsPowerShell_v1.0_powershell.exe'.FaceName = "delete"
'Console\%SystemRoot%_SysWOW64_WindowsPowerShell_v1.0_powershell.exe'.FaceName = "delete"
