# The distro itself: everything here is something stock Windows does that we
# don't. dfnstrate layers every config over this file (it's compiled in), the
# Nix module included. Machine-specific settings (user, disk) belong in a
# per-machine config.
#
# Tables merge, lists append, other values are replaced by later files.

# Our shell (shell/), compiled into dfnstrate. Explorer is still around as a
# program (`explorer .` opens a file window); it's just not the shell anymore.
shell = "builtin"

# The Mono variant: conhost only offers fixed-pitch fonts, and the plain Nerd
# Font has double-width icons that aren't. The shell draws with this family
# too (FONT_FACE in shell/src/main.rs). Same tarball nixpkgs' nerd-fonts.iosevka
# unpacks.
fonts = [
  { url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/Iosevka.tar.xz", hash = "sha256-O5TqHcOVV1Z2L5d7dne8pnGUfdVrx1Wm+EZajoO18lc=", member = "IosevkaNerdFontMono-Regular.ttf" },
  { url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/Iosevka.tar.xz", hash = "sha256-O5TqHcOVV1Z2L5d7dne8pnGUfdVrx1Wm+EZajoO18lc=", member = "IosevkaNerdFontMono-Bold.ttf" },
  { url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/Iosevka.tar.xz", hash = "sha256-O5TqHcOVV1Z2L5d7dne8pnGUfdVrx1Wm+EZajoO18lc=", member = "IosevkaNerdFontMono-Italic.ttf" },
  { url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/Iosevka.tar.xz", hash = "sha256-O5TqHcOVV1Z2L5d7dne8pnGUfdVrx1Wm+EZajoO18lc=", member = "IosevkaNerdFontMono-BoldItalic.ttf" },
]

# Microsoft only hands out download links that expire after a day, so this
# pins the file and `dfnstrate fetch` gets a fresh link. When Microsoft moves
# on to a newer build, `dfnstrate fetch --update` prints the new pin.
[iso]
name = "Windows11_Client_x64_en-us_26300_9457.iso"
hash = "sha256-vUMH3zK8ivM7OczssRdK6zRThmMPiaK4bHpONrVeplA="
language = "English (United States)"

# WSL, installed offline during setup. A machine's Linux install, if it has
# one, goes in wsl.linux (see README).
[wsl]
package = { url = "https://github.com/microsoft/WSL/releases/download/3.0.5/wsl.3.0.5.0.x64.msi", hash = "sha256-IxPvxYc+P4VS9C53+VD6vZE8AokHj6idIQDzQhpSXqo=" }
busybox = { url = "https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox", hash = "sha256-bhI+fzICqMHpsflNiUFYCiUTU4K5no0+NPuFi7oxE0g=" }

# GPU drivers, at the machine's first real boot (the image is built on a VM's
# virtual GPU). See "GPU drivers" in the README.
#
# winget's own repo doesn't carry GPU drivers: its validation sandbox has no
# GPU to install them on, so NVIDIA's app was turned down repeatedly
# (microsoft/winget-pkgs#348600) and GeForce Experience was removed. What's
# there under the vendors' names doesn't install a driver: AMD's
# "AMDSoftwareCloudEdition" is for Azure's V620 VMs, and Intel's
# "Intel.IntelDriverAndSupportAssistant" installs silently but only offers
# drivers in a browser page that wants clicks. So the vendor lists start
# empty, and Windows Update does the driver.
[gpu]
# Search Windows Update for display drivers and install them right away.
# It would get to them on its own eventually, but the first boot is when a
# games console wants them. NVIDIA's WU driver lags its own by a few weeks.
windowsUpdate = true
# winget IDs, installed only when the machine has a GPU from that vendor
# (found by PCI vendor ID; a hybrid laptop gets both lists).
nvidia = []
amd = []
intel = []

# Ads, upsells and cloud-account funnels. Xbox stays (games want its
# identity provider), as do the codecs and the small utilities.
# There's no Copilot to remove: this build doesn't provision one.
[appx]
remove = [
  "Clipchamp.Clipchamp",
  "MSTeams",
  "Microsoft.BingNews",
  "Microsoft.BingSearch",
  "Microsoft.BingWeather",
  "Microsoft.GetHelp",
  "Microsoft.MicrosoftOfficeHub",
  "Microsoft.MicrosoftSolitaireCollection",
  "Microsoft.OutlookForWindows",
  "Microsoft.PowerAutomateDesktop",
  "Microsoft.Todos",
  "Microsoft.Windows.DevHome",
  "Microsoft.WindowsFeedbackHub",
  "Microsoft.YourPhone",
  "MicrosoftCorporationII.QuickAssist",
  # Widgets. They hang off explorer's taskbar, which we don't run.
  "MicrosoftWindows.Client.WebExperience",
  "MicrosoftWindows.CrossDevice",
]

# How the shell behaves, under cosmic-comp's own names so a COSMIC config
# carries over key for key (README, "Shell settings"). These are the
# maintainer's COSMIC settings (nixconf's cosmic.nix), not COSMIC's stock ones;
# cosmic-comp's own defaults are noted where they differ.
[cosmic.compositor]                  # com.system76.CosmicComp
autotile = true                      # stock: false
autotile_behavior = "PerWorkspace"   # stock: "Global"
active_hint = true
focus_follows_cursor = true          # stock: false
focus_follows_cursor_delay = 100     # ms; stock: 250
cursor_follows_focus = true          # stock: false
# Windows on other workspaces don't get to pull you there by raising
# themselves; they're marked urgent instead. Stock: "Focus".
activation_policy = "FocusIfActiveWorkspace"

[cosmic.theme]                       # com.system76.CosmicTheme.Dark
# (outer, inner). cosmic-comp halves `inner` between tiles, rounding down, so
# (0, 1) is a 1 px margin at the screen's edges and none between tiles.
gaps = [0, 1]                        # stock: [0, 8]
active_hint = 1                      # px; stock: 3
# The maintainer's stylix base0D, #8b8683, in COSMIC's 0-1 channels.
accent = { red = 0.5450980392, green = 0.5254901961, blue = 0.5137254902 }

# COSMIC's custom shortcuts: they replace the default binding for the same
# keys (README, "Keys"). "Disable" hands the keys to Windows and the app.
[cosmic.shortcuts]
"Super+y" = "Disable"                # tiling toggle
"Super+slash" = "Disable"            # launcher (Super+d is it here)
"Super+f" = "Disable"                # home folder
"Super+t" = { System = "Terminal" }
"Super+d" = { System = "Launcher" }
"Super+Shift+space" = { System = "PlayPause" }
"Super+Escape" = { System = "LockScreen" }

[registry.system]
# 24H2+ silently BitLockers the system drive on first sign-in and escrows
# the recovery key to a Microsoft account. We don't have one.
'CurrentControlSet\Control\BitLocker'.PreventDeviceEncryption.dword = 1
# Keep the RTC in UTC like every other OS, so dual-booting Linux doesn't
# shift the clock by the UTC offset every boot.
'CurrentControlSet\Control\TimeZoneInformation'.RealTimeIsUniversal.dword = 1
# Fast Startup is hibernation in disguise: it leaves NTFS marked in use,
# and Linux then refuses to mount it read-write.
'CurrentControlSet\Control\Session Manager\Power'.HiberbootEnabled.dword = 0

[registry.software]
# Conhost's font picker only lists TrueType faces named here.
'Microsoft\Windows NT\CurrentVersion\Console\TrueTypeFont'."000".sz = "Iosevka NFM"
# Pro clamps 0 ("Security") up to 1 ("Required"); only Enterprise/Education
# honour 0. Still the lowest this edition goes.
'Policies\Microsoft\Windows\DataCollection'.AllowTelemetry.dword = 0
'Policies\Microsoft\Windows\CloudContent'.DisableWindowsConsumerFeatures.dword = 1
# Recall.
'Policies\Microsoft\Windows\WindowsAI'.DisableAIDataAnalysis.dword = 1
'Policies\Microsoft\Windows\WindowsUpdate\AU'.NoAutoRebootWithLoggedOnUsers.dword = 1
# The shell has uiAccess (shell/build.rs): it can send input to and read the
# input of any window on the user's desktop, elevated ones included. UAC's
# prompts stay out of its reach only because they're drawn on the secure
# desktop; with that off, the shell, or anything that subverted it, could
# click "Yes" on them. These are Windows' defaults, pinned so no later layer
# turns them off by accident:
# https://learn.microsoft.com/en-us/windows/security/application-security/application-control/user-account-control/settings-and-configuration
# - "Switch to the secure desktop when prompting for elevation"
'Microsoft\Windows\CurrentVersion\Policies\System'.PromptOnSecureDesktop.dword = 1
# - "Allow UIAccess applications to prompt for elevation without using the
#   secure desktop": no
'Microsoft\Windows\CurrentVersion\Policies\System'.EnableUIADesktopToggle.dword = 0
# - "Only elevate UIAccess applications that are installed in secure
#   locations" (Program Files, System32), where the user can't swap the exe
'Microsoft\Windows\CurrentVersion\Policies\System'.EnableSecureUIAPaths.dword = 1

[registry.defaultUser]
# The Default profile ships with this Run entry, so every new account
# installs OneDrive on first sign-in.
'Software\Microsoft\Windows\CurrentVersion\Run'.OneDriveSetup = "delete"
# Silently installed "suggested" apps and the ads in Start / lock screen.
'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager' = { OemPreInstalledAppsEnabled.dword = 0, PreInstalledAppsEnabled.dword = 0, SilentInstalledAppsEnabled.dword = 0, SoftLandingEnabled.dword = 0, SystemPaneSuggestionsEnabled.dword = 0, RotatingLockScreenOverlayEnabled.dword = 0 }
# Win+L locks the session before the shell's keyboard hook can swallow it,
# and the shell uses Super+L for COSMIC's "focus right". Super+Escape locks
# instead (shell/src/keys.rs).
'Software\Microsoft\Windows\CurrentVersion\Policies\System'.DisableLockWorkstation.dword = 1
# Bing results in local search.
'Software\Policies\Microsoft\Windows\Explorer'.DisableSearchBoxSuggestions.dword = 1
'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'.HideFileExt.dword = 0
# "Enhance pointer precision" off: mouse acceleration makes the same hand
# movement turn a different distance depending on speed, which wrecks aim.
# Stock is "1"/"6"/"10"; zeros are what the checkbox writes when unticked.
'Control Panel\Mouse' = { MouseSpeed.sz = "0", MouseThreshold1.sz = "0", MouseThreshold2.sz = "0" }
# The hotkeys for Sticky, Filter and Toggle Keys pop a dialog over the game
# (and out of exclusive fullscreen) after 5 Shift presses, or Shift or
# NumLock held for 8/5 seconds. The features themselves stay in Settings.
# Each Flags is the stock value (510/126/62) minus the *_HOTKEYACTIVE bit
# (0x4): https://learn.microsoft.com/windows/win32/api/winuser/ns-winuser-stickykeys
'Control Panel\Accessibility\StickyKeys'.Flags.sz = "506"
'Control Panel\Accessibility\Keyboard Response'.Flags.sz = "122"
'Control Panel\Accessibility\ToggleKeys'.Flags.sz = "58"
# Every console window's defaults. FontFamily 0x36 is TMPF_TRUETYPE |
# FF_MODERN; FontSize is the cell height (18) in the high word.
Console = { FaceName.sz = "Iosevka NFM", FontFamily.dword = 54, FontWeight.dword = 400, FontSize.dword = 1179648 }
# Windows 11 hands every new console to Windows Terminal once its package is
# registered for the user ("Let Windows decide"), and Terminal ignores all of
# the above (it came up in Cascadia Mono). This GUID is conhost, the
# "Windows Console Host" choice in that setting.
'Console\%%Startup' = { DelegationConsole.sz = "{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}", DelegationTerminal.sz = "{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}" }
# powershell.exe's own subkeys pin Lucida Console over the defaults above.
'Console\%SystemRoot%_System32_WindowsPowerShell_v1.0_powershell.exe'.FaceName = "delete"
'Console\%SystemRoot%_SysWOW64_WindowsPowerShell_v1.0_powershell.exe'.FaceName = "delete"
