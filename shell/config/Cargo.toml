# shell.json's format: written by dfnstrate (cli/src/cosmic.rs), read by the
# shell (shell/src/settings.rs). One definition, so the two can't drift.
# Under shell/ so the shell's Nix build, whose source is shell/ alone, has it.
[package]
name = "shell-config"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
