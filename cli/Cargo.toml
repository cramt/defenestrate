[package]
name = "dfnstrate"
version = "0.1.0"
edition = "2024"
description = "Builds a declarative Windows install from Microsoft's stock ISO, and flashes it"
license = "MIT"
repository = "https://github.com/cramt/defenestrate"

[dependencies]
anyhow = "1"
# self-update only. No default features: the GitHub source is all it needs
# (github_releases is its only default), and blocking is the sync API.
axoupdater = { version = "0.10", default-features = false, features = ["github_releases", "blocking"], optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
# offline: the protocol definitions bundled in the crate, not downloaded
# by its build script (which the Nix sandbox would block).
headless_chrome = { version = "1", default-features = false, features = ["offline"] }
libc = "0.2"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
xz2 = { version = "0.1", features = ["static"] }
zstd = { version = "0.13", features = ["zstdmt"] }

# Both on in the release binaries (dist-workspace.toml), off by default so a
# plain `cargo build` needs no Windows cross toolchain.
[features]
# Fails the build unless DEFENESTRATE_SHELL_DIR is set (build.rs), so a
# release can't quietly ship without the shell.
builtin-shell = []
# `dfnstrate self-update`, for installs from the release installer.
self-update = ["dep:axoupdater"]
